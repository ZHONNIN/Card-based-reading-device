<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Reader Toy – Puzzle Assembly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #fce4ec 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
        }

        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 60px;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        /* ==================== PUZZLE ASSEMBLY AREA ==================== */
        .puzzle-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            position: relative;
            flex-shrink: 0;
        }

        .assembly-frame {
            position: relative;
            width: 580px;
            height: 580px;
            border: 4px solid rgba(50, 50, 50, 0.6);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 30;
            flex-shrink: 0;
        }

        .assembly-slot {
            position: absolute;
            width: 50%;
            height: 50%;
            border: 2px dashed rgba(120, 120, 120, 0.25);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: rgba(150, 150, 150, 0.2);
            user-select: none;
            pointer-events: none;
        }

        .assembly-slot[data-position="top-left"] {
            top: 0;
            left: 0;
            border-right-width: 1px;
            border-bottom-width: 1px;
        }

        .assembly-slot[data-position="top-right"] {
            top: 0;
            right: 0;
            border-left-width: 1px;
            border-bottom-width: 1px;
        }

        .assembly-slot[data-position="bottom-left"] {
            bottom: 0;
            left: 0;
            border-right-width: 1px;
            border-top-width: 1px;
        }

        .assembly-slot[data-position="bottom-right"] {
            bottom: 0;
            right: 0;
            border-left-width: 1px;
            border-top-width: 1px;
        }

        .puzzle-pieces-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .puzzle-piece {
            width: 200px;
            height: 200px;
            cursor: grab;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35));
            transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
            user-select: none;
            transform-origin: center center;
        }

        .puzzle-piece:hover {
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.45));
            transform: scale(1.05) rotate(0deg) !important;
        }

        .puzzle-piece:active {
            cursor: grabbing;
        }

        .puzzle-piece.dragging {
            z-index: 1000;
            transition: none;
            cursor: grabbing;
        }

        .puzzle-piece.snapped {
            cursor: default;
            filter: none;
            pointer-events: none;
        }

        .puzzle-piece.fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Complete Card */
        .complete-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            cursor: grab;
            filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.4));
            transition: opacity 0.8s ease 0.3s;
            user-select: none;
            z-index: 100;
        }

        .complete-card.visible {
            opacity: 1;
            pointer-events: all;
        }

        .complete-card:hover {
            filter: drop-shadow(0 16px 40px rgba(0, 0, 0, 0.5));
        }

        .complete-card.dragging {
            z-index: 2000;
            cursor: grabbing;
            transition: none;
        }

        .complete-card.inserted {
            z-index: 10 !important;
            cursor: pointer;
            transition: top 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        left 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        /* ==================== DEVICE AREA ==================== */
        .device-area {
            position: relative;
            width: 520px;
            flex-shrink: 0;
        }

        .device-image {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
            user-select: none;
            position: relative;
            z-index: 20;
        }

        .screen-overlay {
            position: absolute;
            width: 420px;
            height: 420px;
            top: 145px;
            left: 50%;
            transform: translateX(-50%);
            overflow: hidden;
            border-radius: 38px;
            z-index: 40;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .screen-content {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            text-align: center;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        .screen-content.visible {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .screen-emoji {
            font-size: 110px;
            line-height: 1;
        }

        .screen-word {
            font-size: 56px;
            font-weight: bold;
            color: #2d3748;
            text-align: center;
        }

        .screen-pronunciation {
            font-size: 32px;
            color: #4a5568;
            font-style: italic;
            text-align: center;
        }

        .device-mask {
            position: absolute;
            width: 100%;
            height: 35%;
            bottom: 0;
            left: 0;
            background: transparent;
            z-index: 30;
            pointer-events: none;
        }

        .slot-area {
            position: absolute;
            width: 360px;
            height: 260px;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            pointer-events: all;
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <!-- Puzzle Assembly Area -->
        <div class="puzzle-area">
            <div class="assembly-frame" id="assemblyFrame">
                <!-- Assembly slots with visual guides -->
                <div class="assembly-slot" data-position="top-left"></div>
                <div class="assembly-slot" data-position="top-right"></div>
                <div class="assembly-slot" data-position="bottom-left"></div>
                <div class="assembly-slot" data-position="bottom-right"></div>

                <!-- Complete Card (appears after assembly) -->
                <img src="complete.png" alt="Complete Card" class="complete-card" id="completeCard"
                     data-emoji="🐸"
                     data-word="Frog"
                     data-pronunciation="/frɒg/">
            </div>

            <div class="puzzle-pieces-container" id="piecesContainer">
                <img src="FOTLC.png" alt="Top-Left Piece" class="puzzle-piece"
                     data-position="top-left" id="pieceTL">
                <img src="FOTRC.png" alt="Top-Right Piece" class="puzzle-piece"
                     data-position="top-right" id="pieceTR">
                <img src="FOLLQ.png" alt="Bottom-Left Piece" class="puzzle-piece"
                     data-position="bottom-left" id="pieceBL">
                <img src="FOLRQ.png" alt="Bottom-Right Piece" class="puzzle-piece"
                     data-position="bottom-right" id="pieceBR">
            </div>
        </div>

        <!-- Device Area -->
        <div class="device-area" id="deviceArea">
            <img src="po.png" alt="Card Reader Device" class="device-image">

            <div class="screen-overlay" id="screenOverlay">
                <div class="screen-content" id="screenContent">
                    <div class="screen-emoji" id="screenEmoji"></div>
                    <div class="screen-word" id="screenWord"></div>
                    <div class="screen-pronunciation" id="screenPronunciation"></div>
                </div>
            </div>

            <div class="device-mask"></div>
            <div class="slot-area" id="slotArea"></div>
        </div>
    </div>

    <script>
        // ==================== DOM ELEMENTS ====================
        const assemblyFrame = document.getElementById('assemblyFrame');
        const piecesContainer = document.getElementById('piecesContainer');
        const puzzlePieces = document.querySelectorAll('.puzzle-piece');
        const assemblySlots = document.querySelectorAll('.assembly-slot');
        const completeCard = document.getElementById('completeCard');
        const deviceArea = document.getElementById('deviceArea');
        const slotArea = document.getElementById('slotArea');
        const screenContent = document.getElementById('screenContent');
        const screenEmoji = document.getElementById('screenEmoji');
        const screenWord = document.getElementById('screenWord');
        const screenPronunciation = document.getElementById('screenPronunciation');

        // ==================== STATE ====================
        let draggedElement = null;
        let dragStartX = 0;
        let dragStartY = 0;
        let elementStartX = 0;
        let elementStartY = 0;
        const snappedPieces = new Set();
        let puzzleComplete = false;
        let currentInsertedCard = null;

        // ==================== INITIALIZATION ====================
        // Randomize puzzle piece positions and rotations
        puzzlePieces.forEach(piece => {
            const randomRotation = Math.random() * 30 - 15; // -15° to +15°
            piece.style.transform = `rotate(${randomRotation}deg)`;
            piece.dataset.originalRotation = randomRotation;
        });

        // ==================== PUZZLE PIECE DRAG HANDLERS ====================
        puzzlePieces.forEach(piece => {
            piece.addEventListener('mousedown', startPieceDrag);
            piece.addEventListener('touchstart', startPieceDrag, { passive: false });
        });

        document.addEventListener('mousemove', handleDrag);
        document.addEventListener('touchmove', handleDrag, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        function startPieceDrag(e) {
            const piece = e.currentTarget;
            if (piece.classList.contains('snapped')) return;

            e.preventDefault();
            draggedElement = piece;

            const touch = e.touches ? e.touches[0] : e;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;

            const rect = piece.getBoundingClientRect();
            elementStartX = rect.left + rect.width / 2;
            elementStartY = rect.top + rect.height / 2;

            piece.classList.add('dragging');
            piece.style.position = 'fixed';
            piece.style.left = elementStartX + 'px';
            piece.style.top = elementStartY + 'px';
            piece.style.transform = 'translate(-50%, -50%) rotate(0deg)';
            piece.style.zIndex = '1000';
        }

        function handleDrag(e) {
            if (!draggedElement) return;
            e.preventDefault();

            const touch = e.touches ? e.touches[0] : e;
            const deltaX = touch.clientX - dragStartX;
            const deltaY = touch.clientY - dragStartY;

            draggedElement.style.left = (elementStartX + deltaX) + 'px';
            draggedElement.style.top = (elementStartY + deltaY) + 'px';
        }

        function endDrag(e) {
            if (!draggedElement) return;

            const element = draggedElement;

            // Check if it's a puzzle piece or complete card
            if (element.classList.contains('puzzle-piece')) {
                endPieceDrag(element);
            } else if (element.classList.contains('complete-card')) {
                endCardDrag(element);
            }

            draggedElement = null;
        }

        function endPieceDrag(piece) {
            const piecePosition = piece.dataset.position;
            const pieceRect = piece.getBoundingClientRect();

            // Check if piece is over the correct slot
            let snapped = false;
            assemblySlots.forEach(slot => {
                const slotPosition = slot.dataset.position;
                if (slotPosition !== piecePosition) return;

                const slotRect = slot.getBoundingClientRect();

                // Calculate overlap area
                const overlapX = Math.max(0, Math.min(pieceRect.right, slotRect.right) - Math.max(pieceRect.left, slotRect.left));
                const overlapY = Math.max(0, Math.min(pieceRect.bottom, slotRect.bottom) - Math.max(pieceRect.top, slotRect.top));
                const overlapArea = overlapX * overlapY;
                const pieceArea = pieceRect.width * pieceRect.height;

                // If at least 25% of piece is over the correct slot, snap it
                if (overlapArea > pieceArea * 0.25) {
                    snapPieceToSlot(piece, slot);
                    snapped = true;
                }
            });

            if (!snapped) {
                returnPieceToContainer(piece);
            }
        }

        function snapPieceToSlot(piece, slot) {
            const slotRect = slot.getBoundingClientRect();
            const frameRect = assemblyFrame.getBoundingClientRect();

            // Calculate position relative to frame
            const relativeTop = slotRect.top - frameRect.top;
            const relativeLeft = slotRect.left - frameRect.left;

            // Move piece to assembly frame
            assemblyFrame.appendChild(piece);

            piece.style.position = 'absolute';
            piece.style.left = relativeLeft + 'px';
            piece.style.top = relativeTop + 'px';
            piece.style.width = '50%';
            piece.style.height = '50%';
            piece.style.transform = 'rotate(0deg)';
            piece.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            piece.style.zIndex = '5';
            piece.classList.add('snapped');
            piece.classList.remove('dragging');

            snappedPieces.add(piece.dataset.position);

            // Check if puzzle is complete
            if (snappedPieces.size === 4) {
                setTimeout(completePuzzle, 600);
            }
        }

        function returnPieceToContainer(piece) {
            piece.classList.remove('dragging');
            piecesContainer.appendChild(piece);

            piece.style.position = '';
            piece.style.left = '';
            piece.style.top = '';
            piece.style.width = '';
            piece.style.height = '';
            piece.style.transform = `rotate(${piece.dataset.originalRotation}deg)`;
            piece.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            piece.style.zIndex = '';

            setTimeout(() => {
                piece.style.transition = '';
            }, 400);
        }

        function completePuzzle() {
            puzzleComplete = true;

            // Fade out puzzle pieces
            puzzlePieces.forEach(piece => {
                piece.classList.add('fade-out');
            });

            // Fade in complete card
            setTimeout(() => {
                completeCard.classList.add('visible');

                // Remove puzzle pieces from DOM after fade
                setTimeout(() => {
                    puzzlePieces.forEach(piece => {
                        piece.style.display = 'none';
                    });
                }, 800);
            }, 400);
        }

        // ==================== COMPLETE CARD DRAG HANDLERS ====================
        completeCard.addEventListener('mousedown', startCardDrag);
        completeCard.addEventListener('touchstart', startCardDrag, { passive: false });

        // Click to remove inserted card
        completeCard.addEventListener('click', (e) => {
            if (completeCard.classList.contains('inserted') && !draggedElement) {
                removeCard(completeCard);
            }
        });

        function startCardDrag(e) {
            if (!puzzleComplete) return;
            if (completeCard.classList.contains('inserted')) return;

            e.preventDefault();
            draggedElement = completeCard;

            const touch = e.touches ? e.touches[0] : e;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;

            const rect = completeCard.getBoundingClientRect();
            elementStartX = rect.left + rect.width / 2;
            elementStartY = rect.top + rect.height / 2;

            completeCard.classList.add('dragging');
            completeCard.style.position = 'fixed';
            completeCard.style.left = elementStartX + 'px';
            completeCard.style.top = elementStartY + 'px';
            completeCard.style.transform = 'translate(-50%, -50%) rotate(0deg)';
            completeCard.style.zIndex = '1000';
        }

        function endCardDrag(card) {
            card.classList.remove('dragging');

            const cardRect = card.getBoundingClientRect();
            const slotRect = slotArea.getBoundingClientRect();

            // Check if card is over the slot area
            const isOverSlot = (
                cardRect.left < slotRect.right &&
                cardRect.right > slotRect.left &&
                cardRect.top < slotRect.bottom &&
                cardRect.bottom > slotRect.top
            );

            if (isOverSlot) {
                insertCard(card);
            } else {
                returnCardToFrame(card);
            }
        }

        function insertCard(card) {
            // Compute dynamic insertion position based on slot area
            const deviceRect = deviceArea.getBoundingClientRect();
            const slotRect = slotArea.getBoundingClientRect();

            // Position so card snaps lower into the slot
            const insertedTop = slotRect.top - deviceRect.top - 40;

            // Insert card
            currentInsertedCard = card;
            card.classList.add('inserted');
            card.classList.remove('dragging');

            // Move to device area
            deviceArea.appendChild(card);

            // Set precise position
            card.style.position = 'absolute';
            card.style.left = '50%';
            card.style.top = insertedTop + 'px';
            card.style.transform = 'translateX(-50%) rotate(0deg)';
            card.style.zIndex = '10';
            card.style.width = '580px';
            card.style.height = '580px';
            card.style.transition = 'top 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), left 0.4s cubic-bezier(0.4, 0, 0.2, 1)';

            // Update screen content
            const emoji = card.getAttribute('data-emoji');
            const word = card.getAttribute('data-word');
            const pronunciation = card.getAttribute('data-pronunciation');

            screenEmoji.textContent = emoji;
            screenWord.textContent = word;
            screenPronunciation.textContent = pronunciation;
            screenContent.classList.add('visible');
        }

        function removeCard(card) {
            if (!card) return;

            card.classList.remove('inserted');
            screenContent.classList.remove('visible');

            returnCardToFrame(card);

            if (currentInsertedCard === card) {
                currentInsertedCard = null;
            }
        }

        function returnCardToFrame(card) {
            card.classList.remove('dragging');
            assemblyFrame.appendChild(card);

            card.style.position = 'absolute';
            card.style.left = '0';
            card.style.top = '0';
            card.style.width = '580px';
            card.style.height = '580px';
            card.style.transform = 'rotate(0deg)';
            card.style.zIndex = '15';
            card.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';

            setTimeout(() => {
                card.style.transition = '';
            }, 500);
        }

        // ==================== PREVENT DEFAULT IMAGE DRAG ====================
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('dragstart', (e) => {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
