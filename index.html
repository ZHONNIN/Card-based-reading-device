<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Reader Toy – Fan-Spread Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #fce4ec 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            padding: 20px;
        }

        .device-wrapper {
            position: relative;
            width: 940px;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .device-image {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
            user-select: none;
            position: relative;
            z-index: 10;
        }

        .screen-overlay {
            position: absolute;
            width: 596px;
            height: 596px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -58%);
            z-index: 11;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .screen-content {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            animation: fadeIn 0.4s ease-out;
        }

        .screen-content.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .screen-emoji {
            font-size: 110px;
            line-height: 1;
        }

        .screen-word {
            font-size: 56px;
            font-weight: bold;
            color: #2d3748;
            text-align: center;
        }

        .screen-pronunciation {
            font-size: 32px;
            color: #4a5568;
            font-style: italic;
            text-align: center;
        }

        .device-mask {
            position: absolute;
            width: 100%;
            height: 260px;
            bottom: 0;
            left: 0;
            background: transparent;
            z-index: 20;
            pointer-events: none;
        }

        .slot-area {
            position: absolute;
            width: 260px;
            height: 180px;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
            pointer-events: all;
        }

        .cards-container {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            width: 100%;
            height: 420px;
            margin-bottom: 20px;
        }

        .card {
            position: absolute;
            width: auto;
            height: 380px;
            cursor: grab;
            transition: transform 0.3s ease, z-index 0s;
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.35));
            user-select: none;
            transform-origin: center bottom;
        }

        .card:hover {
            filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.45));
        }

        .card:active {
            cursor: grabbing;
        }

        .card[data-card-id="frog"] {
            left: calc(50% - 120px);
            transform: translateX(-50%) rotate(-14deg);
            z-index: 28;
        }

        .card[data-card-id="leaf"] {
            left: 50%;
            transform: translateX(-50%) rotate(0deg);
            z-index: 30;
        }

        .card[data-card-id="water"] {
            left: calc(50% + 120px);
            transform: translateX(-50%) rotate(14deg);
            z-index: 29;
        }

        .card.dragging {
            z-index: 999 !important;
            transition: none;
            cursor: grabbing;
        }

        .card.inserted {
            z-index: 1 !important;
            cursor: pointer;
            transition: top 0.35s ease-out, transform 0.35s ease-out, left 0.35s ease-out !important;
        }

        .card.returning {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        .remove-btn {
            padding: 18px 45px;
            background: #ff6b6b;
            color: white;
            border: 4px solid #c92a2a;
            border-radius: 36px;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 30px;
            z-index: 20;
        }

        .remove-btn.visible {
            opacity: 1;
            pointer-events: all;
        }

        .remove-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
        }

        .remove-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="device-wrapper">
            <img src="po.png" alt="Card Reader Device" class="device-image" id="deviceImage">

            <div class="screen-overlay" id="screenOverlay">
                <div class="screen-content" id="screenContent">
                    <div class="screen-emoji" id="screenEmoji"></div>
                    <div class="screen-word" id="screenWord"></div>
                    <div class="screen-pronunciation" id="screenPronunciation"></div>
                </div>
            </div>

            <div class="device-mask"></div>
            <div class="slot-area" id="slotArea"></div>
        </div>

        <div class="cards-container" id="cardsContainer">
            <img src="card1.png" alt="Frog Card" class="card"
                 data-card-id="frog"
                 data-emoji="🐸"
                 data-word="Frog"
                 data-pronunciation="/frɒg/"
                 data-rotation="-14"
                 data-position-offset="-120"
                 data-z-index="28">

            <img src="card2.png" alt="Leaf Card" class="card"
                 data-card-id="leaf"
                 data-emoji="🌿"
                 data-word="Leaf"
                 data-pronunciation="/liːf/"
                 data-rotation="0"
                 data-position-offset="0"
                 data-z-index="30">

            <img src="card3.png" alt="Water Card" class="card"
                 data-card-id="water"
                 data-emoji="💧"
                 data-word="Water"
                 data-pronunciation="/ˈwɔːtər/"
                 data-rotation="14"
                 data-position-offset="120"
                 data-z-index="29">
        </div>

        <button class="remove-btn" id="removeBtn">Remove Card</button>
    </div>

    <script>
        const cards = document.querySelectorAll('.card');
        const cardsContainer = document.getElementById('cardsContainer');
        const slotArea = document.getElementById('slotArea');
        const deviceWrapper = document.querySelector('.device-wrapper');
        const screenContent = document.getElementById('screenContent');
        const screenEmoji = document.getElementById('screenEmoji');
        const screenWord = document.getElementById('screenWord');
        const screenPronunciation = document.getElementById('screenPronunciation');
        const removeBtn = document.getElementById('removeBtn');

        let currentInsertedCard = null;
        let draggedCard = null;
        let dragStartX = 0;
        let dragStartY = 0;
        let cardStartX = 0;
        let cardStartY = 0;

        // Store original card data
        const cardOriginalData = new Map();
        cards.forEach(card => {
            cardOriginalData.set(card, {
                rotation: card.getAttribute('data-rotation'),
                positionOffset: card.getAttribute('data-position-offset'),
                zIndex: card.getAttribute('data-z-index'),
                parent: card.parentElement
            });
        });

        // Click to insert/remove
        cards.forEach(card => {
            card.addEventListener('click', (e) => {
                if (!card.classList.contains('dragging') && !draggedCard) {
                    if (card === currentInsertedCard) {
                        removeCard(card);
                    } else {
                        insertCard(card);
                    }
                }
            });

            // Mouse drag
            card.addEventListener('mousedown', startDrag);

            // Touch drag
            card.addEventListener('touchstart', startDrag, { passive: false });
        });

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, { passive: false });

        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        removeBtn.addEventListener('click', () => {
            if (currentInsertedCard) {
                removeCard(currentInsertedCard);
            }
        });

        function startDrag(e) {
            const card = e.currentTarget;
            if (card.classList.contains('inserted')) return;

            e.preventDefault();
            draggedCard = card;

            const touch = e.touches ? e.touches[0] : e;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;

            const rect = card.getBoundingClientRect();
            cardStartX = rect.left + rect.width / 2;
            cardStartY = rect.top;

            card.classList.add('dragging');
            card.style.position = 'fixed';
            card.style.left = cardStartX + 'px';
            card.style.top = rect.top + 'px';
            card.style.transform = 'translate(-50%, 0) rotate(0deg)';
            card.style.zIndex = '999';
        }

        function drag(e) {
            if (!draggedCard) return;
            e.preventDefault();

            const touch = e.touches ? e.touches[0] : e;
            const deltaX = touch.clientX - dragStartX;
            const deltaY = touch.clientY - dragStartY;

            draggedCard.style.left = (cardStartX + deltaX) + 'px';
            draggedCard.style.top = (cardStartY + deltaY) + 'px';
        }

        function endDrag(e) {
            if (!draggedCard) return;

            const card = draggedCard;
            card.classList.remove('dragging');

            const cardRect = card.getBoundingClientRect();
            const slotRect = slotArea.getBoundingClientRect();

            const isOverSlot = (
                cardRect.left < slotRect.right &&
                cardRect.right > slotRect.left &&
                cardRect.top < slotRect.bottom &&
                cardRect.bottom > slotRect.top
            );

            if (isOverSlot) {
                insertCard(card);
            } else {
                returnCardToOriginalPosition(card);
            }

            draggedCard = null;
        }

        function insertCard(card) {
            // Remove previous card if exists
            if (currentInsertedCard && currentInsertedCard !== card) {
                removeCard(currentInsertedCard, true);
            }

            // Compute dynamic insertion position
            const deviceRect = deviceWrapper.getBoundingClientRect();
            const slotRect = slotArea.getBoundingClientRect();
            const cardHeight = card.offsetHeight || 380;

            // Position so ~90% of card is hidden behind device
            const insertedTop = slotRect.top - deviceRect.top + (slotRect.height * 0.1);

            // Insert new card
            currentInsertedCard = card;
            card.classList.add('inserted');
            card.classList.remove('returning', 'dragging');

            // Move to device wrapper
            deviceWrapper.appendChild(card);

            // Set precise position
            card.style.position = 'absolute';
            card.style.left = '50%';
            card.style.top = insertedTop + 'px';
            card.style.transform = 'translateX(-50%) rotate(0deg)';
            card.style.zIndex = '1';
            card.style.transition = 'top 0.35s ease-out, transform 0.35s ease-out, left 0.35s ease-out';

            // Update screen content
            const emoji = card.getAttribute('data-emoji');
            const word = card.getAttribute('data-word');
            const pronunciation = card.getAttribute('data-pronunciation');

            screenEmoji.textContent = emoji;
            screenWord.textContent = word;
            screenPronunciation.textContent = pronunciation;
            screenContent.classList.add('visible');

            // Show remove button
            removeBtn.classList.add('visible');
        }

        function removeCard(card, silent = false) {
            if (!card) return;

            card.classList.remove('inserted');

            // Clear screen
            if (!silent) {
                screenContent.classList.remove('visible');
                removeBtn.classList.remove('visible');
            }

            // Return to original position
            returnCardToOriginalPosition(card);

            if (currentInsertedCard === card) {
                currentInsertedCard = null;
            }
        }

        function returnCardToOriginalPosition(card) {
            const originalData = cardOriginalData.get(card);
            if (!originalData) return;

            card.classList.add('returning');

            // Return to cards container
            originalData.parent.appendChild(card);

            // Explicitly restore original fan position
            const rotation = originalData.rotation;
            const offset = originalData.positionOffset;
            const zIndex = originalData.zIndex;

            card.style.position = 'absolute';
            card.style.left = `calc(50% + ${offset}px)`;
            card.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
            card.style.zIndex = zIndex;
            card.style.top = '';
            card.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';

            // After animation, clean up inline styles
            setTimeout(() => {
                card.style.position = '';
                card.style.left = '';
                card.style.transform = '';
                card.style.zIndex = '';
                card.style.top = '';
                card.style.transition = '';
                card.classList.remove('returning');
            }, 550);
        }

        // Prevent default drag on all images
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('dragstart', (e) => {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
