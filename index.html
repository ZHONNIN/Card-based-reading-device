<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Reader Toy – Multi-Card Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #fce4ec 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: fixed;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 20px;
        }

        .device-wrapper {
            position: relative;
            width: 940px;
            margin: 0 auto;
        }

        .device-image {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
            user-select: none;
            position: relative;
            z-index: 10;
        }

        .screen-overlay {
            position: absolute;
            width: 596px;
            height: 596px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -58%);
            z-index: 11;
            pointer-events: all;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .screen-content {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            animation: fadeIn 0.5s ease;
        }

        .screen-content.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .screen-emoji {
            font-size: 120px;
            line-height: 1;
        }

        .screen-word {
            font-size: 60px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        .screen-pronunciation {
            font-size: 36px;
            color: #666;
            font-style: italic;
            text-align: center;
        }

        .device-mask {
            position: absolute;
            width: 100%;
            height: 50%;
            bottom: 0;
            left: 0;
            z-index: 9;
            pointer-events: none;
        }

        .slot-area {
            position: absolute;
            width: 200px;
            height: 300px;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
            pointer-events: all;
        }

        .cards-container {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            position: relative;
            z-index: 4;
        }

        .card {
            position: relative;
            width: auto;
            height: 240px;
            cursor: grab;
            transition: transform 0.3s ease, opacity 0.3s ease;
            filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.25));
            user-select: none;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card:active {
            cursor: grabbing;
        }

        .card.dragging {
            opacity: 0.5;
            z-index: 100;
        }

        .card.inserted {
            position: absolute;
            top: 300px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            cursor: pointer;
            transition: top 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.returning {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-placeholder {
            width: 160px;
            height: 240px;
            border: 3px dashed #ccc;
            border-radius: 12px;
            opacity: 0.5;
        }

        .remove-btn {
            padding: 20px 50px;
            background: #ff6b6b;
            color: white;
            border: 4px solid #c92a2a;
            border-radius: 40px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            margin-top: 20px;
        }

        .remove-btn.visible {
            opacity: 1;
            pointer-events: all;
        }

        .remove-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .remove-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 1200px) {
            .device-wrapper {
                width: 700px;
            }

            .screen-overlay {
                width: 450px;
                height: 450px;
            }

            .card {
                height: 180px;
            }

            .card.inserted {
                top: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="device-wrapper">
            <img src="po.png" alt="Card Reader Device" class="device-image">

            <div class="screen-overlay" id="screenOverlay">
                <div class="screen-content" id="screenContent">
                    <div class="screen-emoji" id="screenEmoji"></div>
                    <div class="screen-word" id="screenWord"></div>
                    <div class="screen-pronunciation" id="screenPronunciation"></div>
                </div>
            </div>

            <div class="device-mask"></div>
            <div class="slot-area" id="slotArea"></div>
        </div>

        <div class="cards-container" id="cardsContainer">
            <img src="card1.png" alt="Frog Card" class="card" data-card-id="frog" data-emoji="🐸" data-word="Frog" data-pronunciation="/frɒg/" draggable="true">
            <img src="card2.png" alt="Leaf Card" class="card" data-card-id="leaf" data-emoji="🌿" data-word="Leaf" data-pronunciation="/liːf/" draggable="true">
            <img src="card3.png" alt="Water Card" class="card" data-card-id="water" data-emoji="💧" data-word="Water" data-pronunciation="/ˈwɔːtər/" draggable="true">
        </div>

        <button class="remove-btn" id="removeBtn">Remove Card</button>
    </div>

    <script>
        const cards = document.querySelectorAll('.card');
        const cardsContainer = document.getElementById('cardsContainer');
        const slotArea = document.getElementById('slotArea');
        const screenOverlay = document.getElementById('screenOverlay');
        const screenContent = document.getElementById('screenContent');
        const screenEmoji = document.getElementById('screenEmoji');
        const screenWord = document.getElementById('screenWord');
        const screenPronunciation = document.getElementById('screenPronunciation');
        const removeBtn = document.getElementById('removeBtn');

        let currentInsertedCard = null;
        let draggedCard = null;
        let cardOriginalPositions = new Map();

        // Store original positions
        cards.forEach((card, index) => {
            const rect = card.getBoundingClientRect();
            cardOriginalPositions.set(card, {
                index: index,
                parent: card.parentElement
            });
        });

        // Click to insert/remove
        cards.forEach(card => {
            card.addEventListener('click', (e) => {
                if (!card.classList.contains('dragging')) {
                    if (card === currentInsertedCard) {
                        removeCard(card);
                    } else {
                        insertCard(card);
                    }
                }
            });
        });

        // Drag and drop
        cards.forEach(card => {
            card.addEventListener('dragstart', (e) => {
                draggedCard = card;
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });

            card.addEventListener('dragend', (e) => {
                card.classList.remove('dragging');

                const slotRect = slotArea.getBoundingClientRect();
                const cardRect = card.getBoundingClientRect();

                const isOverSlot = (
                    cardRect.left < slotRect.right &&
                    cardRect.right > slotRect.left &&
                    cardRect.top < slotRect.bottom &&
                    cardRect.bottom > slotRect.top
                );

                if (isOverSlot) {
                    insertCard(card);
                } else if (card === currentInsertedCard) {
                    // Dragged out of slot
                    removeCard(card);
                }

                draggedCard = null;
            });
        });

        slotArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });

        slotArea.addEventListener('drop', (e) => {
            e.preventDefault();
            if (draggedCard) {
                insertCard(draggedCard);
            }
        });

        removeBtn.addEventListener('click', () => {
            if (currentInsertedCard) {
                removeCard(currentInsertedCard);
            }
        });

        function insertCard(card) {
            // Remove previous card if exists
            if (currentInsertedCard && currentInsertedCard !== card) {
                removeCard(currentInsertedCard, true);
            }

            // Insert new card
            currentInsertedCard = card;
            card.classList.add('inserted');
            card.classList.remove('returning');
            card.style.position = 'absolute';
            card.style.top = '300px';
            card.style.left = '50%';
            card.style.transform = 'translateX(-50%)';
            card.style.zIndex = '1';

            // Update screen content
            const emoji = card.getAttribute('data-emoji');
            const word = card.getAttribute('data-word');
            const pronunciation = card.getAttribute('data-pronunciation');

            screenEmoji.textContent = emoji;
            screenWord.textContent = word;
            screenPronunciation.textContent = pronunciation;
            screenContent.classList.add('visible');

            // Show remove button
            removeBtn.classList.add('visible');

            // Move to device wrapper
            const deviceWrapper = document.querySelector('.device-wrapper');
            deviceWrapper.appendChild(card);
        }

        function removeCard(card, silent = false) {
            if (!card) return;

            card.classList.remove('inserted');
            card.classList.add('returning');

            // Clear screen
            screenContent.classList.remove('visible');
            removeBtn.classList.remove('visible');

            // Return to original position
            const originalData = cardOriginalPositions.get(card);
            if (originalData) {
                originalData.parent.appendChild(card);

                setTimeout(() => {
                    card.style.position = '';
                    card.style.top = '';
                    card.style.left = '';
                    card.style.transform = '';
                    card.style.zIndex = '';
                    card.classList.remove('returning');
                }, 100);
            }

            if (currentInsertedCard === card) {
                currentInsertedCard = null;
            }
        }

        // Prevent default drag behavior on images
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('dragstart', (e) => {
                if (!img.classList.contains('card')) {
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
