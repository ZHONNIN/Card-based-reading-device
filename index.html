<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Reader Toy – Web Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #fce4ec 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #2d3748;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
        }

        .device-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .device-image {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
            user-select: none;
            position: relative;
            z-index: 1;
        }

        /* Screen overlay positioned on top of the purple screen area in po.png */
        .screen-overlay {
            position: absolute;
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            z-index: 2;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .screen-overlay.active {
            pointer-events: all;
        }

        .screen-content {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        .screen-content.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hotspot {
            width: 220px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #333;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .hotspot:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 1);
        }

        .hotspot:active {
            transform: scale(0.95);
        }

        /* Green card positioned below the device */
        .card {
            position: absolute;
            width: 150px;
            height: 200px;
            background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
            border: 3px solid #388e3c;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            bottom: -250px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
        }

        .card.inserted {
            transform: translate(-50%, -380px);
            cursor: default;
        }

        .card::before {
            content: '🃏';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            opacity: 0.3;
        }

        .card-label {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #388e3c;
            transition: opacity 0.3s ease;
        }

        .card.inserted .card-label {
            opacity: 0;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
            position: relative;
            z-index: 4;
        }

        .remove-btn {
            padding: 12px 30px;
            background: #ff6b6b;
            color: white;
            border: 3px solid #c92a2a;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            opacity: 0;
            pointer-events: none;
        }

        .remove-btn.visible {
            opacity: 1;
            pointer-events: all;
        }

        .remove-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .remove-btn:active {
            transform: translateY(0);
        }

        .feedback {
            min-height: 40px;
            min-width: 200px;
            padding: 10px 20px;
            background: white;
            border: 3px solid #333;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .feedback.visible {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .device-wrapper {
                max-width: 90%;
            }

            .screen-overlay {
                width: 250px;
                height: 250px;
            }

            .hotspot {
                width: 180px;
                padding: 12px;
                font-size: 16px;
            }

            .card {
                width: 120px;
                height: 160px;
            }

            .card::before {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="title">🎴 Card Reader Toy</div>

    <div class="container">
        <div class="device-wrapper">
            <!-- Fixed device background image -->
            <img src="po.png" alt="Card Reader Device" class="device-image" id="deviceImage">

            <!-- Screen overlay positioned on top of the purple screen area -->
            <div class="screen-overlay" id="screenOverlay">
                <div class="screen-content" id="screenContent">
                    <div class="hotspot" data-sound="frog">🐸 Frog</div>
                    <div class="hotspot" data-sound="leaf">🌿 Leaf</div>
                    <div class="hotspot" data-sound="water">💧 Water Drop</div>
                </div>
            </div>

            <!-- Green card that slides up -->
            <div class="card" id="card">
                <div class="card-label">Click to Insert →</div>
            </div>
        </div>

        <div class="controls">
            <button class="remove-btn" id="removeBtn">Remove Card</button>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const screenOverlay = document.getElementById('screenOverlay');
        const screenContent = document.getElementById('screenContent');
        const removeBtn = document.getElementById('removeBtn');
        const feedback = document.getElementById('feedback');
        const hotspots = document.querySelectorAll('.hotspot');

        let isCardInserted = false;

        // Card click handler - insert card into slot
        card.addEventListener('click', () => {
            if (!isCardInserted) {
                insertCard();
            }
        });

        // Remove button handler - slide card back down
        removeBtn.addEventListener('click', () => {
            removeCard();
        });

        // Hotspot handlers - play sounds when clicked
        hotspots.forEach(hotspot => {
            hotspot.addEventListener('click', () => {
                const sound = hotspot.getAttribute('data-sound');
                playSound(sound);
            });
        });

        function insertCard() {
            isCardInserted = true;
            card.classList.add('inserted');

            // Activate screen after card slides up
            setTimeout(() => {
                screenOverlay.classList.add('active');
                screenContent.classList.add('visible');
                removeBtn.classList.add('visible');
            }, 500);
        }

        function removeCard() {
            // Deactivate screen
            screenOverlay.classList.remove('active');
            screenContent.classList.remove('visible');
            removeBtn.classList.remove('visible');
            feedback.classList.remove('visible');
            feedback.textContent = '';

            // Slide card back down
            setTimeout(() => {
                card.classList.remove('inserted');
                isCardInserted = false;
            }, 300);
        }

        function playSound(type) {
            let message = '';

            switch(type) {
                case 'frog':
                    message = '🐸 Croak croak!';
                    break;
                case 'leaf':
                    message = '🌿 Rustling sound…';
                    break;
                case 'water':
                    message = '💧 Splash!';
                    break;
            }

            feedback.textContent = message;
            feedback.classList.add('visible');

            // Hide feedback after 2 seconds
            setTimeout(() => {
                feedback.classList.remove('visible');
            }, 2000);
        }
    </script>
</body>
</html>
